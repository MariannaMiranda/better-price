<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug Knight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030308;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      user-select: none;
    }
    canvas {
      display: block;
      box-shadow: 0 0 60px rgba(30, 50, 180, 0.25), 0 0 120px rgba(10, 20, 80, 0.4);
    }
    #hint {
      color: #2a2a4a;
      font-size: 11px;
      margin-top: 12px;
      letter-spacing: 1.5px;
    }
  </style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<div id="hint">ARROWS / WASD — move &nbsp;·&nbsp; W / SPACE / UP — jump (double jump) &nbsp;·&nbsp; Z / X — attack</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;

// ── Input ──────────────────────────────────────────────────────────
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.key]) justPressed[e.key] = true;
  keys[e.key] = true;
  if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ── World ──────────────────────────────────────────────────────────
const GRAVITY    = 0.55;
const MAX_FALL   = 17;
const WALK_SPEED = 4.8;
const JUMP_VEL   = -13.8;
const DJUMP_VEL  = -11.5;

const platforms = [
  { x: 0,   y: 432, w: 800, h: 68 },  // ground
  { x: 75,  y: 348, w: 145, h: 18 },
  { x: 315, y: 290, w: 115, h: 18 },
  { x: 535, y: 318, w: 165, h: 18 },
  { x: 185, y: 218, w: 105, h: 18 },
  { x: 425, y: 185, w: 135, h: 18 },
  { x: 650, y: 228, w: 115, h: 18 },
  { x: 300, y: 128, w: 85,  h: 18 },
];

// ── Particle system ────────────────────────────────────────────────
const fxParticles = [];
const bgDust = [];

for (let i = 0; i < 38; i++) {
  bgDust.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.18,
    vy: -(Math.random() * 0.22 + 0.05),
    r: Math.random() * 1.6 + 0.3,
    color: Math.random() > 0.45 ? '#6677bb' : '#bbccff',
  });
}

function spawnParticle(x, y, opts) {
  fxParticles.push({
    x, y,
    vx: opts.vx ?? (Math.random() - 0.5) * 2,
    vy: opts.vy ?? -(Math.random() * 1.5),
    r: opts.r ?? (Math.random() * 2 + 0.8),
    color: opts.color ?? '#aabbff',
    glow: opts.glow ?? false,
    type: opts.type ?? 'dust',
    life: opts.life ?? 25,
    maxLife: opts.life ?? 25,
  });
}

// ── Player ─────────────────────────────────────────────────────────
const P = {
  x: 160, y: 395,
  vx: 0, vy: 0,
  hw: 11, hh: 19,   // half-width, half-height for AABB

  onGround: false,
  facing: 1,
  state: 'idle',

  // animation
  tick: 0,
  walkPhase: 0,
  bodyBob: 0,
  targetBob: 0,
  capeOff: 0,
  antPhase: 0,
  landSquash: 0,
  jumpStretch: 0,

  // combat
  attacking: false,
  atkTimer: 0,
  atkDuration: 20,
  atkCooldown: 0,

  // jump
  coyote: 0,
  dJump: true,
};

let slashFx = null;
let dJumpFx = null;

function bottom() { return P.y + P.hh; }

function updatePlayer() {
  P.tick++;

  const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
  const right  = keys['ArrowRight'] || keys['d'] || keys['D'];
  const jump   = justPressed['ArrowUp'] || justPressed['w'] || justPressed['W'] || justPressed[' '];
  const attack = justPressed['z'] || justPressed['Z'] || justPressed['x'] || justPressed['X'];

  // Attack
  if (P.atkCooldown > 0) P.atkCooldown--;
  if (attack && P.atkCooldown <= 0) {
    P.attacking  = true;
    P.atkTimer   = P.atkDuration;
    P.atkCooldown = 30;
    slashFx = { x: P.x + P.facing * 24, y: P.y - 5, facing: P.facing, t: P.atkDuration };
    // spark particles
    for (let i = 0; i < 5; i++) {
      spawnParticle(P.x + P.facing * 28, P.y - 4, {
        vx: P.facing * (Math.random() * 3 + 1),
        vy: (Math.random() - 0.5) * 2.5,
        r: Math.random() * 1.8 + 0.5,
        color: '#99bbff', glow: true, type: 'spark', life: 12,
      });
    }
  }
  if (P.attacking) {
    P.atkTimer--;
    if (P.atkTimer <= 0) P.attacking = false;
  }

  // Horizontal
  const canMove = !P.attacking || !P.onGround;
  if (canMove) {
    if (left)       { P.vx = -WALK_SPEED; P.facing = -1; }
    else if (right) { P.vx =  WALK_SPEED; P.facing =  1; }
    else            { P.vx *= 0.76; if (Math.abs(P.vx) < 0.2) P.vx = 0; }
  } else {
    P.vx *= 0.72;
  }

  // Coyote time + double jump reset
  if (P.onGround) { P.coyote = 8; P.dJump = true; }
  else if (P.coyote > 0) P.coyote--;

  // Jump
  if (jump) {
    if (P.coyote > 0) {
      P.vy = JUMP_VEL;
      P.coyote = 0;
      P.jumpStretch = 1;
    } else if (P.dJump) {
      P.vy = DJUMP_VEL;
      P.dJump = false;
      P.jumpStretch = 0.85;
      dJumpFx = { x: P.x, y: P.y, t: 28 };
      for (let i = 0; i < 12; i++) {
        const a = Math.PI + (Math.random() - 0.5) * Math.PI;
        spawnParticle(P.x, bottom(), {
          vx: Math.cos(a) * (Math.random() * 3.5 + 1),
          vy: Math.sin(a) * (Math.random() * 2.5 + 0.5),
          r: Math.random() * 3 + 1,
          color: '#7799ff', glow: true, type: 'soul', life: 28,
        });
      }
    }
  }

  // Variable jump height
  if (P.vy < -5 && !keys['ArrowUp'] && !keys['w'] && !keys['W'] && !keys[' ']) {
    P.vy += 0.55;
  }

  // Gravity
  P.vy = Math.min(P.vy + GRAVITY, MAX_FALL);

  // Move
  P.x += P.vx;
  P.y += P.vy;

  // Wall clamp
  if (P.x < P.hw)      { P.x = P.hw;      P.vx = 0; }
  if (P.x > W - P.hw)  { P.x = W - P.hw;  P.vx = 0; }

  const wasOnGround = P.onGround;
  P.onGround = false;

  for (const pl of platforms) {
    const pxOk = P.x + P.hw > pl.x + 3 && P.x - P.hw < pl.x + pl.w - 3;
    if (pxOk && P.vy >= 0) {
      const curBot = bottom();
      const prevBot = curBot - P.vy;
      if (prevBot <= pl.y + 2 && curBot >= pl.y) {
        P.y = pl.y - P.hh;
        P.vy = 0;
        P.onGround = true;
        if (!wasOnGround) {
          P.landSquash = 1;
          for (let i = 0; i < 7; i++) {
            spawnParticle(P.x + (Math.random() - 0.5) * 22, pl.y, {
              vx: (Math.random() - 0.5) * 3.5,
              vy: -(Math.random() * 1.8),
              r: Math.random() * 2.2, color: '#4455aa', life: 22,
            });
          }
        }
      }
    }
  }

  // State
  if (P.attacking && P.onGround) {
    P.state = 'attack';
  } else if (!P.onGround) {
    P.state = P.vy < 0 ? 'jump' : 'fall';
  } else if (Math.abs(P.vx) > 0.3) {
    P.state = 'walk';
  } else {
    P.state = 'idle';
  }

  // Animation values
  if (P.state === 'walk') P.walkPhase += 0.23;
  else P.walkPhase += 0.04;

  P.targetBob = 0;
  if (P.state === 'idle') P.targetBob = Math.sin(P.tick * 0.048) * 2.2;
  if (P.state === 'walk') P.targetBob = Math.sin(P.walkPhase * 2) * 2.2;
  if (P.state === 'jump') P.targetBob = -3.5;
  if (P.state === 'fall') P.targetBob = 2.5;
  P.bodyBob += (P.targetBob - P.bodyBob) * 0.14;

  if (P.landSquash > 0) P.landSquash = Math.max(0, P.landSquash - 0.07);
  if (P.jumpStretch > 0) P.jumpStretch = Math.max(0, P.jumpStretch - 0.07);

  P.antPhase  = Math.sin(P.tick * 0.09) * 0.45 + P.vx * 0.038;
  P.capeOff   = -P.vx * 1.3 + Math.sin(P.tick * 0.072) * 3.5;
}

// ── Draw background ────────────────────────────────────────────────
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#030310');
  g.addColorStop(1, '#090918');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Soft center bloom
  ctx.save();
  ctx.globalAlpha = 0.055;
  const bloom = ctx.createRadialGradient(400, 190, 20, 400, 190, 340);
  bloom.addColorStop(0, '#3355cc');
  bloom.addColorStop(1, 'transparent');
  ctx.fillStyle = bloom;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Background arches
  ctx.save();
  ctx.globalAlpha = 0.045;
  ctx.strokeStyle = '#3355aa';
  ctx.lineWidth = 2;
  for (let ax = 120; ax < W - 80; ax += 210) {
    ctx.beginPath();
    ctx.arc(ax, 432, 85, -Math.PI, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax - 85, 432);
    ctx.lineTo(ax - 85, 295);
    ctx.moveTo(ax + 85, 432);
    ctx.lineTo(ax + 85, 295);
    ctx.stroke();
  }
  ctx.restore();

  // Hanging chains
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.strokeStyle = '#5566aa';
  ctx.lineWidth = 2;
  for (let cx = 55; cx < W; cx += 175) {
    for (let cy = 0; cy < 260; cy += 22) {
      ctx.beginPath();
      ctx.ellipse(cx, cy + 11, 4, 9, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawMushroom(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(-5, -26, 10, 26);

  ctx.save();
  ctx.shadowColor = '#2244cc';
  ctx.shadowBlur = 22;
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = '#161630';
  ctx.beginPath();
  ctx.ellipse(0, -26, 23, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#3355aa';
  ctx.beginPath();
  ctx.ellipse(0, -30, 14, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.globalAlpha = 0.38;
  ctx.fillStyle = '#6688cc';
  for (const [sx, sy] of [[-9, -29], [0, -33], [9, -28]]) {
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPlatforms() {
  for (const pl of platforms) {
    const g = ctx.createLinearGradient(pl.x, pl.y, pl.x, pl.y + pl.h);
    g.addColorStop(0, '#1c1c2e');
    g.addColorStop(0.35, '#141422');
    g.addColorStop(1, '#0b0b16');
    ctx.fillStyle = g;
    ctx.fillRect(pl.x, pl.y, pl.w, pl.h);

    // Glowing top edge
    ctx.save();
    ctx.shadowColor = '#2244bb';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#223388';
    ctx.fillRect(pl.x, pl.y, pl.w, 2);
    ctx.restore();

    // Crack texture
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#aabbff';
    ctx.lineWidth = 1;
    for (let tx = pl.x + 28; tx < pl.x + pl.w - 12; tx += 38) {
      ctx.beginPath();
      ctx.moveTo(tx, pl.y + 4);
      ctx.lineTo(tx + 9, pl.y + pl.h - 2);
      ctx.stroke();
    }
    ctx.restore();

    // Edge fade
    ctx.save();
    ctx.globalAlpha = 0.45;
    const lf = ctx.createLinearGradient(pl.x, 0, pl.x + 10, 0);
    lf.addColorStop(0, '#0b0b16'); lf.addColorStop(1, 'transparent');
    ctx.fillStyle = lf; ctx.fillRect(pl.x, pl.y, 10, pl.h);
    const rf = ctx.createLinearGradient(pl.x + pl.w - 10, 0, pl.x + pl.w, 0);
    rf.addColorStop(0, 'transparent'); rf.addColorStop(1, '#0b0b16');
    ctx.fillStyle = rf; ctx.fillRect(pl.x + pl.w - 10, pl.y, 10, pl.h);
    ctx.restore();
  }

  // Mushrooms on some platforms
  drawMushroom(75 + 145 - 8, 348, 0.55);
  drawMushroom(535, 318, 0.48);
  drawMushroom(55, 432, 0.82);
  drawMushroom(748, 432, 0.65);
}

function drawBgDust() {
  for (const d of bgDust) {
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    d.x += d.vx; d.y += d.vy;
    if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
    if (d.x < 0)  d.x = W;
    if (d.x > W)  d.x = 0;
  }
}

function drawFxParticles() {
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const d = fxParticles[i];
    d.x += d.vx; d.y += d.vy;
    if (d.type === 'soul') { d.vx *= 0.87; d.vy *= 0.87; }
    else if (d.type === 'spark') { d.vy += 0.15; }
    else d.vy += 0.04;
    d.life--;
    if (d.life <= 0) { fxParticles.splice(i, 1); continue; }
    const t = d.life / d.maxLife;
    ctx.save();
    ctx.globalAlpha = t * (d.type === 'soul' ? 0.88 : 0.6);
    if (d.glow) { ctx.shadowColor = d.color; ctx.shadowBlur = 10; }
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (d.type === 'soul' ? t : 1), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawSlash() {
  if (!slashFx) return;
  const t = slashFx.t / P.atkDuration;
  const alpha = t > 0.65 ? 1 : t / 0.65;

  ctx.save();
  ctx.translate(slashFx.x, slashFx.y);
  ctx.scale(slashFx.facing, 1);

  const spread = (1 - t) * 1.1;
  const radius = 34 + (1 - t) * 10;

  ctx.globalAlpha = alpha * 0.5;
  ctx.strokeStyle = '#6688ff';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#3355ff';
  ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.arc(0, 0, radius, -Math.PI / 2 - spread, -Math.PI / 2 + spread);
  ctx.stroke();

  ctx.globalAlpha = alpha * 0.9;
  ctx.strokeStyle = '#cce0ff';
  ctx.lineWidth = 2.5;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(0, 0, radius - 2, -Math.PI / 2 - spread * 0.65, -Math.PI / 2 + spread * 0.65);
  ctx.stroke();

  ctx.restore();

  slashFx.t--;
  if (slashFx.t <= 0) slashFx = null;
}

function drawDJumpFx() {
  if (!dJumpFx) return;
  const t = dJumpFx.t / 28;

  ctx.save();
  ctx.translate(dJumpFx.x, dJumpFx.y + 10);
  ctx.globalAlpha = t * 0.65;
  ctx.strokeStyle = '#5577ee';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#3355ff';
  ctx.shadowBlur = 18;

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.scale(side, 1);
    const spread = (1 - t);
    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.quadraticCurveTo(18 + spread * 12, -8 - spread * 6, 32 + spread * 15, 6);
    ctx.quadraticCurveTo(18 + spread * 8, 14, 2, 8);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
  dJumpFx.t--;
  if (dJumpFx.t <= 0) dJumpFx = null;
}

// ── Draw the bug knight character ──────────────────────────────────
function drawBugKnight() {
  const x = Math.round(P.x);
  const y = Math.round(P.y + P.bodyBob);
  const f = P.facing;

  const sqY = 1 + P.landSquash * 0.26;
  const sqX = 1 - P.landSquash * 0.14;
  const stY = 1 + P.jumpStretch * 0.22;
  const stX = 1 - P.jumpStretch * 0.1;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(f * sqX * stX, sqY * stY);

  // Shadow on ground
  if (P.onGround) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, P.hh - P.bodyBob / (sqY * stY), 13 / (sqX * stX), 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── Cape ──
  const cf = P.capeOff;
  const cflap = Math.sin(P.tick * 0.11) * 2.5;
  ctx.fillStyle = '#111126';
  ctx.strokeStyle = '#1c1c36';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-8, -11);
  ctx.bezierCurveTo(-16 + cf * 0.45, -3, -24 + cf + cflap, 12, -19 + cf, 24);
  ctx.bezierCurveTo(-11 + cf * 0.3, 28, 5, 26, 7, 16);
  ctx.lineTo(4, -11);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // ── Legs ──
  const wA = P.state === 'walk' ? Math.sin(P.walkPhase) : 0;
  const wB = P.state === 'walk' ? Math.sin(P.walkPhase + Math.PI) : 0;
  const jl  = P.state === 'jump' ? 5 : P.state === 'fall' ? -2 : 0;

  ctx.strokeStyle = '#1a1a2c';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  // Back legs (fainter)
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.beginPath();
  ctx.moveTo(-4, 4);
  ctx.lineTo(-7 + wA * 5, 14 + wA * 3 + jl * 0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, 4);
  ctx.lineTo(7 + wB * 5, 14 + wB * 3 + jl * 0.5);
  ctx.stroke();
  ctx.restore();

  // Front legs
  ctx.beginPath();
  ctx.moveTo(-5, 11);
  ctx.quadraticCurveTo(-8 + wA * 6, 16 + wA * 4 + jl, -9 + wA * 10, 23 + jl);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(5, 11);
  ctx.quadraticCurveTo(8 + wB * 6, 16 + wB * 4 + jl, 9 + wB * 10, 23 + jl);
  ctx.stroke();

  // ── Body shell ──
  ctx.save();
  if (P.attacking) {
    ctx.shadowColor = '#2244ff';
    ctx.shadowBlur = 28;
  }
  ctx.fillStyle = '#171728';
  ctx.strokeStyle = '#282842';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 14, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // Shell highlight (gives carapace depth)
  ctx.fillStyle = '#1f1f36';
  ctx.beginPath();
  ctx.ellipse(-2, -4, 7, 9, -0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#272744';
  ctx.beginPath();
  ctx.ellipse(-3, -6, 4, 6, -0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Head ──
  ctx.fillStyle = '#171728';
  ctx.strokeStyle = '#272742';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(0, -16, 10, 8.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1f1f38';
  ctx.beginPath();
  ctx.ellipse(-1, -18, 5.5, 5.5, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // ── Eyes (hollow knight glow) ──
  ctx.save();
  ctx.shadowColor = '#6688ff';
  ctx.shadowBlur = 14;
  ctx.fillStyle = '#8899ff';
  ctx.beginPath();
  ctx.ellipse(-4, -17, 3, 2.4, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(4, -17, 3, 2.4, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1e30aa';
  ctx.beginPath();
  ctx.ellipse(-4, -17, 1.4, 1.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(4, -17, 1.4, 1.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eye gleam
  ctx.fillStyle = '#ccddff';
  ctx.beginPath();
  ctx.ellipse(-5, -18, 0.8, 0.6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(3, -18, 0.8, 0.6, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Antennae ──
  const aw = P.antPhase;
  ctx.strokeStyle = '#252540';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.moveTo(-6, -23);
  ctx.quadraticCurveTo(-14 + aw * 7, -33, -17 + aw * 11, -42);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6, -23);
  ctx.quadraticCurveTo(14 + aw * 4, -33, 16 + aw * 8, -42);
  ctx.stroke();

  // Antenna tips
  ctx.save();
  ctx.shadowColor = '#3355cc';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#4466cc';
  ctx.beginPath();
  ctx.arc(-17 + aw * 11, -42, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(16 + aw * 8, -42, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Nail (sword) during attack ──
  if (P.attacking) {
    const at = P.atkTimer / P.atkDuration;
    // Swing arc: from upper-forward down to lower-forward
    const nailAngle = -Math.PI * 0.35 + (1 - at) * Math.PI * 0.72;

    ctx.save();
    ctx.rotate(nailAngle);

    // Handle
    ctx.strokeStyle = '#3a2818';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(2, 2);
    ctx.lineTo(11, 5);
    ctx.stroke();

    // Cross-guard
    ctx.strokeStyle = '#5a4422';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(8, -5);
    ctx.lineTo(13, 9);
    ctx.stroke();

    // Blade
    ctx.save();
    ctx.shadowColor = '#99ccff';
    ctx.shadowBlur = 20;
    ctx.strokeStyle = '#ddeeff';
    ctx.lineWidth = 2.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(11, 3);
    ctx.lineTo(44, -14);
    ctx.stroke();
    // Bright edge
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(13, 1);
    ctx.lineTo(44, -16);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }

  ctx.restore();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, W * 0.28, W / 2, H / 2, W * 0.78);
  g.addColorStop(0, 'transparent');
  g.addColorStop(1, 'rgba(0,0,10,0.8)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawHUD() {
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#5566aa';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`[ ${P.state} ]`, 12, 20);
  ctx.textAlign = 'right';
  ctx.fillText('← → move  ·  W/SPACE jump  ·  double jump  ·  Z/X attack', W - 12, 20);
  ctx.restore();
}

// ── Game loop ──────────────────────────────────────────────────────
function loop() {
  updatePlayer();

  ctx.clearRect(0, 0, W, H);
  drawBg();
  drawBgDust();
  drawPlatforms();
  drawFxParticles();
  drawSlash();
  drawDJumpFx();
  drawBugKnight();
  drawVignette();
  drawHUD();

  for (const k in justPressed) delete justPressed[k];
  requestAnimationFrame(loop);
}

loop();
</script>
