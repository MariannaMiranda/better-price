<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run Loop</title>
<style>

body {
  background: #04060e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
canvas { display: block; }
p { color: #2e4060; font: 10px monospace; margin-top: 6px; letter-spacing: .07em; }
</style>
</head>

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Catmull-Rom → Bezier ────────────────────────────────────────────────────
function crToBezier(p0, p1, p2, p3) {
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6,
    cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6,
    cp2y: p2.y - (p3.y - p1.y) / 6,
  };
}

function buildPath(pts, smooth, closed) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  if (pts.length < 2) return;
  if (!smooth || pts.length === 2) {
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    if (closed) ctx.closePath();
    return;
  }
  const n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i-1] || (closed ? pts[n-1] : pts[i]);
    const p1 = pts[i], p2 = pts[i+1];
    const p3 = pts[i+2] || (closed ? pts[0] : pts[i+1]);
    const c = crToBezier(p0, p1, p2, p3);
    ctx.bezierCurveTo(c.cp1x, c.cp1y, c.cp2x, c.cp2y, p2.x, p2.y);
  }
  if (closed) {
    const p0 = pts[n-2], p1 = pts[n-1], p2 = pts[0], p3 = pts[1] || p2;
    const c = crToBezier(p0, p1, p2, p3);
    ctx.bezierCurveTo(c.cp1x, c.cp1y, c.cp2x, c.cp2y, p2.x, p2.y);
    ctx.closePath();
  }
}

function drawShape(s) {
  if (!s.visible || s.points.length === 0) return;
  buildPath(s.points, s.smooth, s.closed);
  if (s.fillEnabled)   { ctx.fillStyle = s.fillColor; ctx.fill(); }
  if (s.strokeEnabled) {
    ctx.strokeStyle = s.strokeColor;
    ctx.lineWidth   = s.strokeWidth;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke();
  }
}

function withPivot(px, py, angle, fn) {
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.translate(-px, -py);
  fn();
  ctx.restore();
}

  eyeRfil:{name:"eyeRfil",points:[{x:236,y:163.5},{x:252,y:178.5},{x:275,y:184.5},{x:279,y:174.5},{x:267,y:161.5},{x:257,y:156.5},{x:242,y:153.5}],closed:false,smooth:true,strokeColor:"#000000",strokeEnabled:true,fillColor:"#e8e8e8",fillEnabled:true,strokeWidth:2,visible:true},
  petTop: {name:"petTop",points:[{x:222,y:144.5},{x:213,y:133.5},{x:213,y:116.5},{x:217,y:99.5},{x:228,y:106.5},{x:238,y:120.5},{x:240,y:142.5}],closed:false,smooth:true,strokeColor:"#000000",strokeEnabled:true,fillColor:"#e8e8e8",fillEnabled:true,strokeWidth:2,visible:true},
  petL:   {name:"petL",points:[{x:221,y:142.5},{x:204,y:131.5},{x:189,y:127.5},{x:174,y:130.5},{x:172,y:144.5},{x:187,y:153.5},{x:202,y:156.5},{x:219,y:154.5}],closed:false,smooth:true,strokeColor:"#000000",strokeEnabled:true,fillColor:"#e8e8e8",fillEnabled:true,strokeWidth:2,visible:true},
  petR:   {name:"petR",points:[{x:241,y:144.5},{x:250,y:129.5},{x:262,y:116.5},{x:278,y:114.5},{x:282,y:123.5},{x:280,y:134.5},{x:273,y:143.5},{x:251,y:154.5}],closed:false,smooth:true,strokeColor:"#000000",strokeEnabled:true,fillColor:"#e8e8e8",fillEnabled:true,strokeWidth:2,visible:true},

  daisyC2:{name:"daisyC2",points:[{x:222,y:144.5},{x:234,y:141.5},{x:243,y:149.5},{x:235,y:160.5},{x:223,y:157.5},{x:222,y:144.5}],closed:false,smooth:true,strokeColor:"#000000",strokeEnabled:true,fillColor:"#603d0b",fillEnabled:true,strokeWidth:2,visible:true},
};

// ── Anchor points (vertex-space) ─────────────────────────────────────────────
// These are the hip/attachment pivots used for limb swing.
const HIP_L   = { x: 250, y: 510 }; // top of left leg
const HIP_R   = { x: 370, y: 515 }; // top of right leg
const CLK_PIV = { x: 195, y: 355 }; // cloak neck attachment
const DAISY_P = { x: 230, y: 138 }; // daisy centre

// ── Positioning ──────────────────────────────────────────────────────────────
// Vertex canvas: 500×800. Character runs facing LEFT in vertex-space.
// We flip ctx (scale -1 on X) so she runs RIGHT on screen.
// Anchor: body-centre x ≈ 190, feet y ≈ 710.
const SCALE    = 0.50;
const GROUND_Y = 412;
const FEET_VY  = 710;
const BODY_VX  = 190;

// ── State ────────────────────────────────────────────────────────────────────
let charX = -180;
const SPEED = 200; // px/s screen

let daisyBob = 0, daisyVel = 0;
let prevPhaseInt = 0;
let lastT = 0;

function loop(ts) {
  const dt = Math.min((ts - lastT) / 1000, 0.05);
  lastT = ts;

  charX += SPEED * dt;
  if (charX > W + 220) charX = -220;

  // Running phase 0-1, ~3.8 full strides/sec
  const phase     = (ts / 1000 * 3.8) % 1;
  const phaseInt  = Math.floor(phase * 2); // 2 footstrikes per stride
  if (phaseInt !== prevPhaseInt) { daisyVel = -22; }
  prevPhaseInt = phaseInt;

  daisyVel += (0 - daisyBob) * 290 * dt;
  daisyVel *= Math.pow(0.04, dt);
  daisyBob += daisyVel * dt;

  // Body bobs UP on each footstrike (Hollow Knight feel)
  const bodyBob   = -Math.abs(Math.sin(phase * Math.PI * 2)) * 5;

  // Leg swing — opposite phase. In flipped ctx positive rotation = counter-clockwise on screen.
  // Negate so forward swing = clockwise (toward direction of travel).
  const swing     = 0.36;
  const legLAngle = -Math.sin(phase * Math.PI * 2) * swing;
  const legRAngle =  Math.sin(phase * Math.PI * 2) * swing; // opposite

  // Cloak flaps with slight lag
  const cloakAng  = Math.sin(phase * Math.PI * 2 * 0.65 + 0.6) * 0.09;

  // ── Draw background ────────────────────────────────────────────────────────
  ctx.fillStyle = '#04060e';
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(W*0.5, H*0.45, 0, W*0.5, H*0.45, 310);
  glow.addColorStop(0, 'rgba(30,14,65,0.14)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  // Ground glow
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 32);
  gg.addColorStop(0, 'rgba(42,68,170,0.22)'); gg.addColorStop(1, 'transparent');
  ctx.fillStyle = gg; ctx.fillRect(0, GROUND_Y, W, 32);

  // Shadow
  const sx = charX + 14, sy = GROUND_Y + 6;
  const sg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 46);
  sg.addColorStop(0, 'rgba(0,0,0,0.28)'); sg.addColorStop(1, 'transparent');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.ellipse(sx, sy, 46, 11, 0, 0, Math.PI * 2); ctx.fill();

  // ── Character transform ────────────────────────────────────────────────────
  // ctx.scale(-SCALE, SCALE) flips her to face right.
  // Sub-transforms for limbs are applied in vertex-space WITHIN this flipped context.
  ctx.save();
  ctx.translate(charX, GROUND_Y + bodyBob);
  ctx.scale(-SCALE, SCALE);          // <-- horizontal flip: now faces right
  ctx.translate(-BODY_VX, -FEET_VY); // centre the vertex coords

  // 1. Back cloak layers (drawn before legs so legs sit on top)
  withPivot(CLK_PIV.x, CLK_PIV.y, cloakAng, () => {
    drawShape(S.cloak1);
    drawShape(S.cloak2);
    drawShape(S.cloak3);
    drawShape(S.cloak4);
    drawShape(S.cloak5);
  });

  // 2. Back leg (shape_8a / legR — opposite phase, currently behind)
  withPivot(HIP_R.x, HIP_R.y, legRAngle, () => drawShape(S.legR));

  // 3. Front leg (shape_7 / legL — currently reaching forward)
  withPivot(HIP_L.x, HIP_L.y, legLAngle, () => drawShape(S.legL));

  // 4. Head (white fill — fixed)
  drawShape(S.head);

  // 5. Eyes
  drawShape(S.eyeLout);
  drawShape(S.eyeLfil);
  drawShape(S.eyeLhi);
  drawShape(S.eyeRin);
  drawShape(S.eyeRfil);

  // 6. Neck ring
  drawShape(S.ring);

  // 7. Daisy (spring bob on footstrike)
  withPivot(DAISY_P.x, DAISY_P.y, daisyBob * 0.016, () => {
    drawShape(S.petTop);
    drawShape(S.petL);
    drawShape(S.petR);
    drawShape(S.daisyC1);
    drawShape(S.daisyC2);
  });

  ctx.restore();

  requestAnimationFrame(loop);
}

requestAnimationFrame(ts => { lastT = ts; requestAnimationFrame(loop); });
</script>
