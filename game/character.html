<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character — Line Drawing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="460" height="820"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const W = 460, H = 820;

// ── SETUP ────────────────────────────────────────────────────────────────────
ctx.fillStyle   = '#ffffff';
ctx.fillRect(0, 0, W, H);
ctx.strokeStyle = '#161616';
ctx.lineWidth   = 2.2;
ctx.lineCap     = 'round';
ctx.lineJoin    = 'round';

// ── 1. HEAD (large circle, tiny gap near top to keep the hand-drawn feel) ────
const HEAD_X = 215, HEAD_Y = 150, HEAD_R = 90;
ctx.beginPath();
ctx.arc(HEAD_X, HEAD_Y, HEAD_R, -1.50, -1.55 + Math.PI * 2);
ctx.stroke();

// ── 2. DAISY (upper-right of head: 5 petals + small center) ─────────────────
const DX = 318, DY = 80;
const PETAL_DIST = 20;
const PETAL_LEN  = 18;
const PETAL_WID  = 9;
const NUM_PETALS = 5;
const START_ANG  = -Math.PI / 2 - 0.35;

for (let i = 0; i < NUM_PETALS; i++) {
  const a  = START_ANG + (i / NUM_PETALS) * Math.PI * 2;
  const px = DX + Math.cos(a) * PETAL_DIST;
  const py = DY + Math.sin(a) * PETAL_DIST;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(a + Math.PI / 2);
  ctx.beginPath();
  ctx.ellipse(0, 0, PETAL_WID, PETAL_LEN, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}
// Daisy center
ctx.beginPath();
ctx.arc(DX, DY, 6, 0, Math.PI * 2);
ctx.stroke();

// ── 3. EYES (two big ovals + wavy upper line + zig-zag hatching inside) ─────
function drawEye(ex, ey, mirror) {
  const s = mirror ? -1 : 1;

  // Eye outer oval
  ctx.beginPath();
  ctx.ellipse(ex, ey, 28, 36, 0, 0, Math.PI * 2);
  ctx.stroke();

  // Wavy "M" line across the top inside of the eye
  ctx.beginPath();
  ctx.moveTo(ex - s * 20, ey - 22);
  ctx.bezierCurveTo(
    ex - s * 14, ey - 32,
    ex - s * 8,  ey - 18,
    ex - s * 2,  ey - 24
  );
  ctx.bezierCurveTo(
    ex + s * 4,  ey - 30,
    ex + s * 10, ey - 18,
    ex + s * 16, ey - 24
  );
  ctx.stroke();

  // Scribbled zig-zag hatching (top row)
  ctx.beginPath();
  let zx = ex - 14, zy = ey - 2;
  ctx.moveTo(zx, zy);
  for (let i = 1; i <= 7; i++) {
    zx += 4;
    zy += (i % 2 === 0 ? 5 : -5);
    ctx.lineTo(zx, zy);
  }
  ctx.stroke();

  // Scribbled zig-zag hatching (bottom row)
  ctx.beginPath();
  zx = ex - 13; zy = ey + 10;
  ctx.moveTo(zx, zy);
  for (let i = 1; i <= 7; i++) {
    zx += 4;
    zy += (i % 2 === 0 ? -4 : 4);
    ctx.lineTo(zx, zy);
  }
  ctx.stroke();
}

drawEye(190, 148, false); // left eye
drawEye(248, 148, true);  // right eye

// ── 4. RING (small horizontal oval just below the head) ─────────────────────
ctx.beginPath();
ctx.ellipse(235, 258, 19, 7, 0, 0, Math.PI * 2);
ctx.stroke();

// ── 5. NECK (two short parallel lines connecting head to ring) ──────────────
ctx.beginPath();
ctx.moveTo(224, 244); ctx.lineTo(225, 253);
ctx.moveTo(244, 244); ctx.lineTo(243, 253);
ctx.stroke();

// ── 6. CLOAK (overlapping leaf shapes) ──────────────────────────────────────
// Each leaf is an elongated teardrop from the neck-attachment down to a tip.
// White fill so back leaves are hidden behind front ones — only outlines visible.

function drawLeaf(ox, oy, tx, ty, halfWidth) {
  const midX = (ox + tx) / 2;
  const midY = (oy + ty) / 2;
  const dx = tx - ox, dy = ty - oy;
  const len = Math.hypot(dx, dy) || 1;
  const perpX = -dy / len, perpY = dx / len;

  const leftMidX  = midX + perpX * halfWidth;
  const leftMidY  = midY + perpY * halfWidth;
  const rightMidX = midX - perpX * halfWidth;
  const rightMidY = midY - perpY * halfWidth;

  ctx.beginPath();
  ctx.moveTo(ox, oy);
  // Left side: origin → bulge → tip
  ctx.bezierCurveTo(
    ox + perpX * halfWidth * 0.45, oy + perpY * halfWidth * 0.45,
    leftMidX, leftMidY,
    tx, ty
  );
  // Right side: tip → bulge → origin
  ctx.bezierCurveTo(
    rightMidX, rightMidY,
    ox - perpX * halfWidth * 0.45, oy - perpY * halfWidth * 0.45,
    ox, oy
  );
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.stroke();
}

const COX = 233, COY = 258; // cloak attachment point

// Back layer first, then forward layers
drawLeaf(COX - 12, COY,  158, 580, 30); // far left leaf
drawLeaf(COX + 12, COY,  335, 640, 34); // far right leaf (long trailing)
drawLeaf(COX - 6,  COY,  198, 620, 24); // inner left leaf
drawLeaf(COX + 6,  COY,  282, 625, 26); // inner right leaf
drawLeaf(COX,      COY,  235, 645, 30); // center main leaf

// ── 7. LEGS (two thin tapered shapes peeking out at the bottom) ─────────────
function drawLeg(topX, topY, bottomX, bottomY, topWidth) {
  ctx.beginPath();
  // outer edge
  ctx.moveTo(topX - topWidth, topY);
  ctx.bezierCurveTo(
    topX - topWidth * 0.9, topY + (bottomY - topY) * 0.4,
    bottomX - 1.5, bottomY - 8,
    bottomX, bottomY
  );
  // inner edge
  ctx.bezierCurveTo(
    bottomX + 1.5, bottomY - 8,
    topX + topWidth * 0.9, topY + (bottomY - topY) * 0.4,
    topX + topWidth, topY
  );
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.stroke();
}

// Left leg (shorter)
drawLeg(213, 580, 205, 660, 4);
// Right leg (longer, sticks down further)
drawLeg(235, 580, 247, 690, 4);

</script>
</body>
</html>
